<div style="margin-bottom:10px;">
    <input type="text" placeholder="Search..." (input)="onSearch($event)" />

    <button (click)="addRow()">Add</button>
    <button (click)="deleteRow()">Delete</button>
</div>

<ag-grid-angular class="ag-theme-alpine" style="width:100%; height:500px;" [rowData]="rowData" [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef" rowSelection="multiple" (gridReady)="onGridReady($event)">
</ag-grid-angular>
